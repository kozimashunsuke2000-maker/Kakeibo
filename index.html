<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>わが家の家計簿</title>
<meta name="theme-color" content="#121214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Base reset (the Claude artifact viewer used to supply this). */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: chalk ledger on a maroon board — month switch, remaining take-home, category share bar, five category columns with totals, entries stacked under each column */
:root {
  --board: #2a2a2e;
  --board-deep: #121214;
  --chalk: #fbf7f2;
  --chalk-dim: rgba(251, 247, 242, .55);
  --chalk-line: rgba(251, 247, 242, .22);
  --chalk-faint: rgba(251, 247, 242, .15);
  --chalk-hover: rgba(251, 247, 242, .07);
  --accent: #2a2a2e;
  --label: #050505;
  --minus: #ff8f86;
  --paper: #f7f2ee;
  --paper-ink: #2b1414;
  --paper-dim: #7a6262;
  --paper-line: rgba(43, 20, 20, .22);
  --paper-red: #b2433a;
  --c-food: #f4a59a;
  --c-hobby: #f3cf7a;
  --c-misc: #a9d3bb;
  --c-beauty: #d9b0e6;
  --c-fixed: #d8ccc2;
  --font-display: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--board-deep); }
body {
  min-height: 100vh; font-weight: 300;
  background: radial-gradient(120% 80% at 50% 35%, var(--board) 0%, var(--board-deep) 100%) fixed, var(--board-deep);
  color: var(--chalk);
  font-family: var(--font-body); font-size: 14px; line-height: 1.5;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 32px;
  display: grid; gap: 12px; justify-items: center;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--chalk); outline-offset: 3px; }
.tag { background: none; color: var(--chalk); display: inline-block; }
.num { font-variant-numeric: tabular-nums; }

/* top area: about one fifth of the screen */
.top { width: 100%; min-height: 20vh; display: grid; grid-template-rows: auto 1fr auto; align-items: center; gap: 10px; padding-block: 8px 0; }
.topbar { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rules { background: none; color: var(--chalk); text-align: left; margin: 0; padding: 6px 10px; border: 1px solid var(--chalk-dim); border-radius: 8px; display: grid; gap: 2px; font-size: 12px; line-height: 1.4; }
.rules .rule { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.rules b { font-weight: 600; }
.rules .mark { width: 1em; text-align: center; font-weight: 600; }
.rules .no { color: var(--minus); }
.rules .ok { color: var(--c-misc); }
.rules .empty-rule { color: var(--chalk-dim); }
.sheet textarea { width: 100%; min-height: 96px; padding: 8px 10px; background: #fff; color: var(--paper-ink); border: 1px solid var(--paper-line); border-radius: 8px; font: inherit; font-size: 16px; font-weight: 300; resize: vertical; }
.sheet textarea:focus { border-color: var(--paper-ink); outline: none; }
.month { display: flex; align-items: center; font-family: var(--font-display); font-size: 22px; font-weight: 300; padding: 0; }
.month button { background: none; border: 0; padding: 4px 6px; font-size: 15px; line-height: 1; color: var(--chalk-dim); }
.month span { min-width: 2.6em; text-align: center; }
.remain-box { display: flex; justify-content: center; }
.remain-box small { font-size: 11px; color: var(--chalk-dim); }
.remain { border: 0; background: none; color: var(--chalk); font-family: var(--font-display); font-weight: 200; font-size: clamp(36px, 11vw, 48px); line-height: 1.1; padding: 4px 0; letter-spacing: -.01em; }
.remain .cap { font-size: .5em; font-weight: 300; color: var(--chalk-dim); }
.remain.minus .used { color: var(--minus); }
.remain-sub { font-size: 13px; color: var(--chalk-dim); text-align: right; }
.store-note:empty { display: none; }
.today { width: 100%; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 8px; padding: 8px 4px 0; border-top: 1px solid var(--chalk-line); }
.t-toggle { border: 0; background: none; color: var(--chalk); padding: 0; }
.t-day { display: flex; align-items: center; gap: 2px; }
.t-nav { border: 0; background: none; color: var(--chalk-dim); font-size: 18px; line-height: 1; padding: 2px 8px; }
.t-nav:disabled { opacity: .25; }
.t-list { flex-basis: 100%; display: grid; gap: 2px; padding: 4px 8px; border: 1px solid var(--chalk-line); border-radius: 8px; }
.t-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; padding: 4px 0; font-size: 13px; }
.t-row + .t-row { border-top: 1px solid var(--chalk-line); }
.t-cat { font-size: 11px; color: var(--chalk-dim); }
.t-memo { min-width: 0; overflow-wrap: anywhere; }
.t-empty { font-size: 12px; color: var(--chalk-dim); padding: 4px 0; }
.today .t-label { font-size: 12px; color: var(--chalk-dim); }
.today .t-amt { font-size: 22px; font-weight: 300; }
.today .t-sub { font-size: 11px; color: var(--chalk-dim); margin-left: 6px; }
.backup { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.backup-btn { border: 0; background: none; color: var(--chalk-dim); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; padding: 4px 6px; }
.store-note { font-size: 11px; color: var(--chalk-dim); text-align: center; }

/* category share */
.ratio { width: 100%; display: grid; gap: 4px; }
.ratio-bar { display: flex; gap: 1px; height: 7px; border-radius: 3px; overflow: hidden; background: var(--chalk-faint); }
.ratio-bar span { height: 100%; }
.legend { display: flex; flex-wrap: nowrap; justify-content: space-between; gap: 6px; font-size: clamp(9px, 2.4vw, 11px); color: var(--chalk-dim); white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
.legend::-webkit-scrollbar { display: none; }
.legend b { color: var(--chalk); }
.legend i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
.legend b { font-weight: 400; margin-left: 2px; }

/* chalk table */
.ledger-scroll { width: 100%; overflow-x: auto; }
.ledger {
  width: 100%; min-width: 330px;
  border: 1.5px solid var(--chalk); border-radius: 12px;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  margin-top: 8px;
}
.col { min-width: 0; display: grid; grid-template-rows: auto auto 1fr; }
.col + .col { border-left: 1.5px solid var(--chalk); }
.cell { padding: 6px 4px; display: flex; justify-content: center; align-items: center; }
.head { border-bottom: 1.5px solid var(--chalk); flex-direction: column; gap: 0; justify-content: flex-start; padding: 3px 2px 4px; height: 50px; }
.head button.long { font-size: 12px; white-space: pre-line; line-height: 1.15; padding: 0 2px; }
.hint { font-size: 9px; line-height: 1.2; color: var(--chalk-dim); text-align: center; white-space: pre-line; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: -2px; }
.pick { border: 1px solid var(--chalk-dim); background: none; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 300; }
.pick:hover, .pick:active { border-color: var(--chalk); background: var(--chalk-hover); }
.head button { border: 0; font-size: clamp(13px, 3.8vw, 15px); font-weight: 300; padding: 0 4px; line-height: 1.4; white-space: nowrap; }
.total { border-bottom: 1.5px solid var(--chalk); }
.total .tag { font-size: clamp(11px, 3.2vw, 14px); padding: 3px 5px; white-space: nowrap; }
.total button.tag { border: 0; display: grid; justify-items: center; line-height: 1.2; padding: 2px 6px; max-width: 100%; }
.total .used { font-weight: 400; }
.total .cap { font-size: .82em; color: var(--chalk-dim); }
.total .over .used { color: var(--minus); }
/* Make the column names and the budget row stand out from the entries below. */
.ledger { overflow: hidden; }
/* Name and budget read as one block: no rule between them. */
.head { border-bottom: 0; height: 34px; justify-content: center; padding: 4px 2px 0; }
.total { padding-top: 0; }
.head button { font-weight: 600; }

.items { display: flex; flex-direction: column; min-height: calc(80vh - 160px); padding-bottom: 6px; }
.item {
  background: none; border: 0; border-bottom: 1px solid var(--chalk-line);
  padding: 4px 1px; text-align: center; display: grid; gap: 0; width: 100%; line-height: 1.35;
}
.item:hover { background: var(--chalk-hover); }
.item .line { display: flex; align-items: baseline; justify-content: center; gap: 2px; white-space: nowrap; }
.item .day { font-size: 9px; color: var(--chalk-dim); }
.item .amt { font-size: clamp(11px, 3.1vw, 15px); letter-spacing: -.02em; font-weight: 300; white-space: nowrap; }
.item .memo { font-size: 11px; color: var(--chalk-dim); overflow-wrap: anywhere; line-height: 1.3; }
.add {
  margin: 6px auto 0; width: 26px; height: 26px; border-radius: 50%;
  border: 1px dashed var(--chalk-dim); background: none; font-size: 18px; line-height: 1; color: var(--chalk);
}
.add:hover { border-style: solid; }
.fixed-note { font-size: 9px; color: var(--chalk-dim); text-align: center; padding: 4px 2px 0; }

/* top sheet: a smaller light card so the keyboard never covers it */
.backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 20; }
.sheet {
  position: fixed; z-index: 21;
  top: calc(8px + env(safe-area-inset-top, 0px));
  left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  max-height: calc(100% - 16px); overflow-y: auto;
  background: var(--paper); color: var(--paper-ink);
  border-radius: 14px; box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
  padding: 12px 14px 14px;
}
.sheet form { max-width: 480px; margin: 0 auto; display: grid; gap: 8px; }
.sheet h2 { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0; }
.sheet label { display: grid; gap: 3px; font-size: 11px; color: var(--paper-dim); }
.sheet input {
  width: 100%; padding: 8px 10px; background: #fff; color: var(--paper-ink);
  border: 1px solid var(--paper-line); border-radius: 8px; font-size: 16px; font-weight: 300;
}
.sheet input:focus, .sheet select:focus { border-color: var(--paper-ink); outline: none; }
.sheet .big { font-family: var(--font-display); font-size: 22px; font-weight: 300; padding-block: 5px; }
.sheet input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
.sheet input[type="number"]::-webkit-inner-spin-button, .sheet input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; }
.sheet-head .actions { margin-left: auto; }
.close-x { order: 9; width: 32px; height: 32px; border: 0; background: none; color: var(--paper-dim); font-size: 24px; line-height: 1; font-weight: 300; border-radius: 50%; }
.close-x:hover { background: rgba(43, 20, 20, .08); color: var(--paper-ink); }
.amount-row { display: grid; grid-template-columns: 1fr 92px; gap: 8px; align-items: end; }
.sheet select {
  width: 100%; height: 44px; padding: 0 6px; background: #fff; color: var(--paper-ink);
  border: 1px solid var(--paper-line); border-radius: 8px; font: inherit; font-size: 18px; font-weight: 300; text-align: center; text-align-last: center;
}
.actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--paper-line); background: none; color: var(--paper-ink); border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.danger { background: var(--paper-red); border-color: var(--paper-red); color: #fff; }
.confirm-detail { display: grid; gap: 1px; padding: 10px 12px; background: #fff; border: 1px solid var(--paper-line); border-radius: 10px; }
.confirm-detail .c-cat { font-size: 11px; color: var(--paper-dim); }
.confirm-detail .c-amt { font-size: 22px; font-weight: 300; }
.confirm-detail .c-sub { font-size: 12px; }
.msg { font-size: 11px; color: var(--paper-red); }
.msg:empty { display: none; }
.sheet .note { font-size: 11px; color: var(--paper-dim); }
.cal-btn { border: 1px solid var(--chalk-dim); background: none; color: var(--chalk); border-radius: 10px; width: 40px; height: 40px; display: grid; place-items: center; padding: 0; }
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal-head button { border: 0; background: none; color: var(--paper-ink); font-size: 18px; padding: 4px 10px; }
.cal-head b { font-size: 15px; font-weight: 600; }
.cal-head small { font-size: 12px; color: var(--paper-dim); margin-left: 8px; font-weight: 400; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.cal .wd { font-size: 10px; text-align: center; color: var(--paper-dim); padding-bottom: 2px; }
.cal .wd.sun, .cal-day.sun .d { color: var(--paper-red); }
.cal .wd.sat, .cal-day.sat .d { color: #2f63a8; }
.cal-day { border: 1px solid transparent; background: #fff; border-radius: 6px; min-height: 44px; padding: 3px 1px; display: grid; align-content: start; justify-items: center; gap: 1px; color: var(--paper-ink); }
.cal-day .d { font-size: 12px; }
.cal-day .y { font-size: 9px; letter-spacing: -.02em; white-space: nowrap; color: var(--paper-ink); font-weight: 600; }
.cal-day.today { border-color: var(--paper-line); }
.cal-day[aria-pressed="true"] { border-color: var(--paper-ink); background: #f0ebe6; }
.cal-day.blank { background: none; }
.cal-detail { display: grid; gap: 2px; padding: 8px 10px; background: #fff; border: 1px solid var(--paper-line); border-radius: 10px; }
.cal-detail .cd-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
.cal-detail .cd-head b { font-size: 18px; font-weight: 500; }
.cal-detail .cd-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; font-size: 13px; padding: 4px 0; border-top: 1px solid var(--paper-line); }
.cal-detail .cd-cat { font-size: 11px; color: var(--paper-dim); }
.cal-detail .cd-empty { font-size: 12px; color: var(--paper-dim); }
.restore { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.restore:empty { display: none; }
.restore-btn { border: 1px dashed var(--chalk-dim); background: none; color: var(--chalk); border-radius: 999px; padding: 5px 14px; font-size: 12px; font-weight: 300; }
.cat-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.cat-chip { border: 1px solid var(--paper-line); background: #fff; color: var(--paper-ink); border-radius: 999px; padding: 5px 14px; font-size: 13px; }
.cat-chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; padding: 8px 16px; font-size: 13px; border: 1px solid rgba(251, 247, 242, .4); background: #111 !important; color: #fbf7f2 !important; border-radius: 999px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
  <div class="topbar">
    <div class="month">
      <button type="button" id="prev" aria-label="前の月">←</button>
      <span id="monthLabel"></span>
      <button type="button" id="next" aria-label="次の月">→</button>
    </div>
    <button type="button" class="cal-btn" id="calBtn" aria-label="カレンダー">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    </button>
    <button type="button" class="rules" id="rules" aria-label="注意書き（タップで書き直す）"></button>
  </div>
  <div class="remain-box">
    <button type="button" class="remain num" id="remain" aria-label="使った合計と手取り（タップで手取りを変更）"></button>
  </div>

  <div class="ratio">
    <div class="ratio-bar" id="ratioBar"></div>
    <div class="legend" id="legend"></div>
  </div>
  </header>

  <div class="today" id="today"></div>
  <div class="ledger-scroll">
    <div class="ledger" id="ledger"></div>
  </div>
  <div class="restore" id="restore"></div>
  <div class="backup">
    <button type="button" class="backup-btn" id="backupSave">バックアップを保存</button>
    <button type="button" class="backup-btn" id="backupLoad">バックアップから戻す</button>
    <input type="file" id="backupFile" accept="application/json,.json" hidden>
  </div>
  <div class="store-note" id="storeNote"></div>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <form id="sheetForm" novalidate>
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <div class="actions">
        <button type="button" class="btn danger" id="delBtn" hidden>削除</button>
        <button type="button" class="btn" id="altBtn" hidden></button>
        <button type="button" class="close-x" id="cancelBtn" aria-label="閉じる">×</button>
        <button type="submit" class="btn primary" id="saveBtn">保存</button>
      </div>
    </div>
    <div class="msg" id="sheetMsg"></div>
    <div id="sheetFields"></div>
  </form>
</div>
<div class="toast tag" id="toast" hidden></div>

<script>
(() => {
  const CATS = ["食費", "趣味", "雑費", "美容"];
  // Columns the user removed stay out of view (their records are kept and can be brought back).
  const DEFAULT_RULES = [];
  const shown = () => CATS.filter(c => !(settings.hidden || []).includes(c));
  // A removed column's records go to the visible column whose name contains its name
  // (e.g. 雑費 → a column renamed 「娯楽・雑費」). Null when there is no such column.
  const homeFor = c => {
    if (!(settings.hidden || []).includes(c)) return c;
    const base = c === "趣味" ? "娯楽" : c === "美容" ? "自己投資" : c;
    return shown().find(k => label(k).includes(c) || label(k).includes(base)) || null;
  };
  // Each record is moved at most once per page load, so a slow or refused save can never loop.
  const moved = new Set();
  function moveHiddenRecords() {
    entries.filter(e => (settings.hidden || []).includes(e.cat) && !moved.has(e.id)).forEach(e => {
      const to = homeFor(e.cat);
      if (!to) return;
      moved.add(e.id);
      store.put({ ...e, cat: to });
    });
  }
  const FIXED = "固定費";
  const COLORS = { "食費": "var(--c-food)", "趣味": "var(--c-hobby)", "雑費": "var(--c-misc)", "美容": "var(--c-beauty)", "固定費": "var(--c-fixed)" };
  const DEFAULT_TAKE_HOME = 0;
  // Display names; records keep the short key (e.g. "美容") so earlier entries stay in their column.
  const LABELS = { "趣味": "娯楽", "美容": "美容 自己投資" };
  // Names the user set by tapping a column title win over the built-in display names.
  const label = c => (settings.names && settings.names[c]) || LABELS[c] || c;
  const HINTS = {
    "食費": ["コンビニ", "外食"],
    "趣味": ["サーフィン", "買い物"],
    "雑費": ["プレゼント"],
    "美容": [],
    "固定費": ["サブスク"],
  };
  const DEFAULT_BUDGETS = {};
  const fmt = n => Math.abs(Math.round(n)).toLocaleString("ja-JP");
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const yen = n => (n < 0 ? "−¥" : "¥") + Math.abs(Math.round(n)).toLocaleString("ja-JP");

  const today = new Date();
  let view = { y: today.getFullYear(), m: today.getMonth() };
  let entries = [];                                        // {id, cat, amount, memo, date}
  let settings = { takeHome: DEFAULT_TAKE_HOME, fixed: [], budgets: { ...DEFAULT_BUDGETS } }; // fixed: [{id, name, amount}], budgets: {cat: yen}

  // ---------- storage: private per-person db, browser fallback ----------
  let store = null;
  let fixedApplied = false;
  // Speed: show the last known data at once (CACHE_KEY), apply every change on screen immediately,
  // and send it to the backend in the background (queued until the backend is ready).
  const CACHE_KEY = "kakeibo-cache-v1";
  const saveCache = () => { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ entries, settings })); } catch {} };
  function loadCache() {
    try {
      const d = JSON.parse(localStorage.getItem(CACHE_KEY));
      if (d && Array.isArray(d.entries) && d.settings) { entries = d.entries; settings = { ...settings, ...d.settings }; return true; }
    } catch {}
    return false;
  }
  let backend = null;
  const queue = [];

  function renderToday() {

    }));
    $("ratioBar").replaceChildren(...totals.filter(t => t.total > 0).map(t => {

    }));

      tb.addEventListener("click", () => openBudget(cat));

        line.append(el("span", "amt num", yen(e.amount)));
        b.append(line);

  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  // ---------- sheet ----------

  // Calendar of the month: each day shows what was spent that day; tap a day for what it went on.
  function openCalendar() {
    let y = view.y, m = view.m;
    const isToday = (yy, mm, dd) => yy === today.getFullYear() && mm === today.getMonth() && dd === today.getDate();
    let sel = isToday(y, m, today.getDate()) || (y === today.getFullYear() && m === today.getMonth()) ? today.getDate() : null;
    const wrap = el("div"); wrap.style.display = "grid"; wrap.style.gap = "8px";
    const draw = () => {
      const key = `${y}-${pad(m + 1)}`;
      const byDay = {};
      entries.filter(e => e.date && e.date.startsWith(key)).forEach(e => { const d = Number(e.date.slice(8)); (byDay[d] = byDay[d] || []).push(e); });
      const monthSum = Object.values(byDay).flat().reduce((s, e) => s + e.amount, 0);

      const pv = el("button", null, "‹"); pv.type = "button"; pv.setAttribute("aria-label", "前の月");

  $("delBtn").addEventListener("click", async () => {
    if (!onDelete) return;
    if (!delArmed) { delArmed = true; $("delBtn").textContent = "本当に削除する"; return; }
    try { await onDelete(); closeSheet(); render(); }
    catch { $("sheetMsg").textContent = "削除できませんでした。もう一度お試しください"; }
  });
  $("altBtn").addEventListener("click", () => { if (onAlt) onAlt(); });
  $("cancelBtn").addEventListener("click", closeSheet);
  $("backdrop").addEventListener("click", closeSheet);
  document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("sheet").hidden) closeSheet(); });

  $("remain").addEventListener("click", openTakeHome);
  $("calBtn").addEventListener("click", openCalendar);
  $("rules").addEventListener("click", openRules);
  $("prev").addEventListener("click", () => { view.m--; if (view.m < 0) { view.m = 11; view.y--; } render(); });
  $("next").addEventListener("click", () => { view.m++; if (view.m > 11) { view.m = 0; view.y++; } render(); });

  // Shortcut links: …#add opens the entry form, …#food / #hobby / #misc / #beauty open it on that category.
  const HASH_CATS = { add: "食費", food: "食費", hobby: "趣味", misc: "雑費", beauty: "美容" };
  function openFromHash() {
    const key = (location.hash || "").slice(1);
    if (HASH_CATS[key] && $("sheet").hidden) openEntry(HASH_CATS[key], null, key === "add");
  }
  window.addEventListener("hashchange", () => { quickFromHash(); openFromHash(); });

  // iPhone Shortcut quick entry: …#q.<category>.<amount>.<yyyyMMddHHmmss>.<memo as base64url>
  // The category may be food/hobby/misc/beauty or the menu name itself (食費・娯楽・雑費・自己投資…).
  // A link that names no known category (or no amount) still opens the form filled in, so nothing is lost.
  // The record id comes from the link, so opening the same link again never adds a duplicate.
  const QUICK_CATS = {
    food: "食費", "食費": "食費",
    hobby: "趣味", "娯楽": "趣味", "趣味": "趣味",
    misc: "雑費", "雑費": "雑費",
    beauty: "美容", "美容": "美容", "自己投資": "美容", "美容自己投資": "美容", "美容 自己投資": "美容",
  };
  function decodeMemo(b64) {
    if (!b64) return "";
    try {
      const bin = atob(b64.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((b64.length + 3) % 4));
      return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))).trim().slice(0, 30);
    } catch { return ""; }
  }
  function quickFromHash() {
    let raw = (location.hash || "").slice(1);
    try { raw = decodeURIComponent(raw); } catch {}
    if (!raw.startsWith("q.")) return false;
    const [catPart = "", amtPart = "", tsPart = "", memoPart = ""] = raw.slice(2).split(".");
    const named = QUICK_CATS[catPart.trim()] || QUICK_CATS[catPart.trim().toLowerCase()]
      || (settings.names && Object.keys(settings.names).find(k => settings.names[k] === catPart.trim()));
    const cat = named ? homeFor(named) : null;
    const amount = Number(amtPart.replace(/[^\d]/g, "")) || 0;
    const ts = /^\d{14}$/.test(tsPart) ? tsPart : null;
    const memo = /^[A-Za-z0-9_-]*$/.test(memoPart) ? decodeMemo(memoPart) : memoPart.trim().slice(0, 30);
    if (!cat || !amount || !ts) {
      // Something in the Shortcut is off: show the form with what arrived and let the user finish it.
      openEntry(cat || CATS[0], null, true);
      if (amount) $("fAmount").value = amount;
      if (memo) $("fMemo").value = memo;
      $("sheetMsg").textContent = !cat ? "カテゴリが届きませんでした。選んで保存してください" : "内容を確かめて保存してください";
      return true;
    }
    let h = 0;
    for (const ch of raw) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    const e = { id: "s" + ts + h.toString(36), cat, amount, date: `${ts.slice(0, 4)}-${ts.slice(4, 6)}-${ts.slice(6, 8)}`, memo };
    const what = `${label(e.cat)} ${yen(amount)}${e.memo ? "（" + e.memo + "）" : ""}`;
    const i = entries.findIndex(x => x.id === e.id);
    if (i >= 0) entries[i] = e; else entries.push(e);
    saveCache(); render();
    toast(`記録中… ${what}`, 60000);
    send(b => Promise.resolve(b.put(e)).then(() => toast(`✓ ${what} を記録しました`, 4000), () => {}));
    return true;
  }


  loadCache();
  render();
  if (!quickFromHash()) openFromHash();
  useLocal("");

  // ---------- backup (data lives only on this phone) ----------
  $("backupSave").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ app: "kakeibo-mine", v: 1, savedAt: new Date().toISOString(), entries, settings })], { type: "application/json" });
    const a = document.createElement("a");
    const d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = `kakeibo-backup-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.json`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("バックアップを書き出しました");
  });
  $("backupLoad").addEventListener("click", () => $("backupFile").click());
  $("backupFile").addEventListener("change", async ev => {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!file) return;
    try {
      const d = JSON.parse(await file.text());
      if (d.app !== "kakeibo-mine" || !Array.isArray(d.entries) || !d.settings) throw new Error("format");
      entries = d.entries; settings = { ...settings, ...d.settings };
      saveLocal(); render();
      toast(`バックアップから戻しました（${d.entries.length}件）`);
    } catch { toast("このファイルは家計簿のバックアップではありません"); }
  });

  // Works without the network after the first visit.
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
</body>
